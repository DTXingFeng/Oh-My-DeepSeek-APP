plugins { id 'com.android.application' }

android {
    namespace 'app.ohmydeepseek.android'
    compileSdk 35
    defaultConfig {
        applicationId 'app.ohmydeepseek.android'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.4.1'
    }
    buildFeatures { buildConfig true }
    buildTypes {
        debug {
            if (providers.gradleProperty('isolatedImportTest').isPresent()) {
                applicationIdSuffix '.importtest'
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/webAssets')
}

def syncWebAssets = tasks.register('syncWebAssets', Sync) {
    from(rootProject.file('../dist'))
    into(layout.buildDirectory.dir('generated/webAssets/web'))
    doFirst {
        if (!rootProject.file('../dist/index.html').exists()) {
            throw new GradleException('Run npm run build from the repository root before building the APK.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn(syncWebAssets) }
